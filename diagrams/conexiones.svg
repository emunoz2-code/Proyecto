<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1170" viewBox="0 0 1360 1170">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#16324f}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px}.tiny{font-size:14px}</style>
<rect width="1360" height="1170" fill="#f5f8fc"/>
<text x="40" y="48" class="title">ESP32 · L298N · HC-SR04 | Conexiones de referencia</text>
<text x="40" y="82" class="small">ESP32 clásica WROOM-32 · Números GPIO, no posiciones físicas · Confirmar esquema del módulo real</text>
<rect x="40" y="125" width="250" height="350" rx="14" fill="#eaf5f8" stroke="#b9c9da" stroke-width="2"/>
<text x="58" y="157" class="label">ESP32 · salidas 3.3 V</text>
<rect x="610" y="125" width="280" height="350" rx="14" fill="#edf4ec" stroke="#b9c9da" stroke-width="2"/>
<text x="628" y="157" class="label">Módulo L298N</text>
<text x="65" y="211" class="label">GPIO25</text>
<text x="630" y="211" class="small">ENA · PWM izquierdo</text>
<polyline points="290,205 610,205" fill="none" stroke="#187b9a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="254" class="label">GPIO26</text>
<text x="630" y="254" class="small">IN1</text>
<polyline points="290,248 610,248" fill="none" stroke="#7c5bb5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="297" class="label">GPIO27</text>
<text x="630" y="297" class="small">IN2</text>
<polyline points="290,291 610,291" fill="none" stroke="#7c5bb5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="340" class="label">GPIO14</text>
<text x="630" y="340" class="small">ENB · PWM derecho</text>
<polyline points="290,334 610,334" fill="none" stroke="#187b9a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="383" class="label">GPIO18</text>
<text x="630" y="383" class="small">IN3</text>
<polyline points="290,377 610,377" fill="none" stroke="#7c5bb5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="426" class="label">GPIO19</text>
<text x="630" y="426" class="small">IN4</text>
<polyline points="290,420 610,420" fill="none" stroke="#7c5bb5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="328" y="170" class="small">Retirar jumpers ENA y ENB</text>
<rect x="1030" y="160" width="290" height="115" rx="14" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
<text x="1048" y="192" class="label">Motor izquierdo</text>
<text x="1050" y="225" class="small">OUT1 / OUT2</text>
<rect x="1030" y="325" width="290" height="115" rx="14" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
<text x="1048" y="357" class="label">Motor derecho</text>
<text x="1050" y="390" class="small">OUT3 / OUT4</text>
<polyline points="890,220 1030,220" fill="none" stroke="#5d803d" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="890,385 1030,385" fill="none" stroke="#5d803d" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="514" class="small">ENA y ENB: 10 kΩ a GND cada uno. IN1–IN4: 10 kΩ a GND recomendados.</text>
<text x="40" y="544" class="small">Todos los GND unidos. Los motores se conectan a OUT1–OUT4, nunca a GPIO ni al pin 3V3.</text>
<rect x="40" y="580" width="250" height="230" rx="14" fill="#eaf5f8" stroke="#b9c9da" stroke-width="2"/>
<text x="58" y="612" class="label">ESP32 · sensor</text>
<rect x="1050" y="580" width="270" height="230" rx="14" fill="#ffffff" stroke="#b9c9da" stroke-width="2"/>
<text x="1068" y="612" class="label">HC-SR04</text>
<text x="65" y="645" class="label">GPIO23 · TRIG</text>
<text x="1070" y="645" class="small">TRIG</text>
<polyline points="290,640 1050,640" fill="none" stroke="#187b9a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="710" class="label">GPIO34 · entrada</text>
<text x="1070" y="710" class="small">ECHO · 5 V</text>
<polyline points="1050,705 920,705" fill="none" stroke="#cc7934" stroke-width="3" stroke-linejoin="round"/>
<rect x="800" y="694" width="120" height="22" fill="white" stroke="#cc7934" stroke-width="3"/>
<text x="812" y="684" class="small">R1: 2.2 kΩ</text>
<polyline points="800,705 600,705 290,705" fill="none" stroke="#cc7934" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="600" cy="705" r="5" fill="#cc7934"/>
<text x="380" y="685" class="small">Nodo ≈ 3.0 V</text>
<polyline points="600,705 600,730" fill="none" stroke="#cc7934" stroke-width="3" stroke-linejoin="round"/>
<rect x="589" y="730" width="22" height="46" fill="white" stroke="#cc7934" stroke-width="3"/>
<text x="635" y="757" class="small">R2: 3.3 kΩ</text>
<polyline points="600,776 600,795 750,795" fill="none" stroke="#536477" stroke-width="3" stroke-linejoin="round"/>
<text x="765" y="801" class="small">GND</text>
<text x="65" y="770" class="small">ECHO nunca directo a 5 V</text>
<text x="1070" y="760" class="small">VCC: 5 V regulados</text>
<text x="1070" y="790" class="small">GND: referencia común</text>
<rect x="40" y="840" width="1280" height="280" rx="14" fill="#fff7ed" stroke="#b9c9da" stroke-width="2"/>
<text x="58" y="872" class="label">Alimentación y emergencia · Dos contactos NC independientes</text>
<text x="65" y="905" class="small">Banco: ESP32 por USB. Fuente externa 5 V → lógica L298N y HC-SR04; GND común.</text>
<text x="65" y="935" class="small">No unir ese positivo 5 V a VIN/5V de ESP32 con USB conectado. Verificar 5V-EN del módulo.</text>
<text x="65" y="990" class="small">Fuente motor +</text>
<polyline points="225,985 290,985" fill="none" stroke="#c54f3d" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="305" y="990" class="small">Fusible</text>
<polyline points="385,985 445,985" fill="none" stroke="#c54f3d" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="460" y="990" class="small">Contacto NC 1</text>
<polyline points="620,985 700,985" fill="none" stroke="#c54f3d" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="715" y="990" class="small">Vs del L298N</text>
<text x="940" y="990" class="small" style="fill:#c54f3d">Corte físico de potencia</text>
<text x="65" y="1050" class="small">3.3 V</text>
<polyline points="120,1045 185,1045" fill="none" stroke="#187b9a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="200" y="1050" class="small">10 kΩ</text>
<polyline points="270,1045 335,1045" fill="none" stroke="#187b9a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="350" y="1050" class="small">GPIO33</text>
<polyline points="440,1045 510,1045" fill="none" stroke="#187b9a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="525" y="1050" class="small">Contacto NC 2</text>
<polyline points="685,1045 755,1045" fill="none" stroke="#187b9a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="770" y="1050" class="small">GND</text>
<text x="940" y="1050" class="small">Abierto = emergencia</text>
<text x="65" y="1092" class="small">No mezclar los circuitos de ambos contactos. Desconectar energía antes de cambiar cables.</text>
<text x="40" y="1150" class="tiny">Esquema funcional editable; consultar docs/02_montaje.md para dimensionamiento, jumpers, condensadores y procedimiento.</text>
</svg>