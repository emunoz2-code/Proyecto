# Ejecutar Mosquitto desde la raíz del proyecto para resolver estas rutas.
# Para ESP32 física: cambiar 127.0.0.1 por la IPv4 LAN del PC.
listener 1883 127.0.0.1
allow_anonymous false
password_file broker/passwords
acl_file broker/acl.local
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
